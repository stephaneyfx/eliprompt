[package]
name = "eliprompt"
version = "0.4.0"
authors = ["Stephane Raux <stephaneyfx@gmail.com>"]
edition = "2024"
description = "Elegant and informative shell prompt"
license = "0BSD"
homepage = "https://github.com/stephaneyfx/eliprompt"
repository = "https://github.com/stephaneyfx/eliprompt.git"
keywords = ["shell", "prompt", "zsh"]

[dependencies]
ansi_term = "0.12.1"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
git2 = "0.21.0"
jiff = { version = "1.0.1", features = ["serde"] }
moniclock = "0.1.0"
palette = "0.7.7"
rgb = "0.8.53"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
whoami = "2.1.3"
